# forgewire/Cargo.toml
#
# Rust acceleration core for the ForgeWire control plane.
# Workspace of focused crates plus a single PyO3 binding crate that exposes
# the Python-importable extension.

[workspace]
resolver = "2"
members = [
    "crates/fabric-types",
    "crates/fabric-protocol",
    "crates/fabric-identity",
    "crates/fabric-audit",
    "crates/fabric-accounts",
    "crates/fabric-store",
    "crates/fabric-store-rqlite",
    "crates/fabric-policy",
    "crates/fabric-hub",
    "crates/fabric-cli",
    "crates/fabric-client",
    "crates/fabric-egress",
    "crates/fabric-history",
    "crates/fabric-runner",
    "crates/loom-runner",
    "crates/fabric-claim-router",
    "crates/fabric-streams",
    "crates/fabric-beacon",
    "crates/fabric-secrets",
    "crates/fabric-settings",
    "crates/fabric-py",
    "crates/fabric-topology",
    "crates/fabric-compute-lanes",
]

[workspace.package]
version = "0.10.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/ForgeWireLabs/forgewire-fabric"
authors = ["ForgeWire Contributors"]

[workspace.dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "fast"] }
hex = "0.4"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
zeroize = "1.8"
fabric-protocol = { path = "crates/fabric-protocol", version = "0.10.0" }
fabric-claim-router = { path = "crates/fabric-claim-router", version = "0.10.0" }
fabric-streams = { path = "crates/fabric-streams", version = "0.10.0" }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[workspace.lints.clippy]
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
float_cmp = "warn"
needless_pass_by_value = "warn"
cloned_instead_of_copied = "warn"
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"


