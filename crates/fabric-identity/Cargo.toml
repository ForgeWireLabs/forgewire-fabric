[package]
name = "fabric-identity"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Durable ed25519 identity management for ForgeWire Fabric nodes. Identities are encrypted at rest (AES-256-GCM) under an OS-keyring or operator-supplied wrapping key -- never plaintext."

[dependencies]
fabric-types = { package = "forgewire-fabric-types", path = "../fabric-types", version = "0.10.0" }
fabric-protocol = { path = "../fabric-protocol", version = "0.10.0" }
serde.workspace = true
serde_json.workspace = true
ed25519-dalek = { workspace = true, features = ["std", "fast", "rand_core"] }
hex.workspace = true
thiserror.workspace = true
rand = "0.8"
aes-gcm = "0.10"
zeroize.workspace = true
keyring = { version = "4.1.4", default-features = false, features = ["v1"], optional = true }

[features]
default = ["os-keyring"]
os-keyring = ["dep:keyring"]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
