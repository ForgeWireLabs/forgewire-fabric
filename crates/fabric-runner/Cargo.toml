[package]
name = "fabric-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native Rust runner daemon for ForgeWire Fabric."

[[bin]]
name = "forgewire-runner"
path = "src/main.rs"

[dependencies]
fabric-types = { package = "forgewire-fabric-types", path = "../fabric-types", version = "0.10.0" }
fabric-protocol = { path = "../fabric-protocol", version = "0.10.0" }
fabric-identity = { path = "../fabric-identity", version = "0.10.0" }
fabric-client = { path = "../fabric-client", version = "0.10.0" }
fabric-egress = { path = "../fabric-egress", version = "0.10.0" }
fabric-beacon = { path = "../fabric-beacon", version = "0.10.0" }
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
fabric-identity = { path = "../fabric-identity", version = "0.10.0" }
fabric-types = { package = "forgewire-fabric-types", path = "../fabric-types", version = "0.10.0" }

[lints]
workspace = true
