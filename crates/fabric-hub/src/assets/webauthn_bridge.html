<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ForgeWire Fabric &mdash; Passkey</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        max-width: 30rem;
        margin: 4rem auto;
        padding: 0 1.5rem;
        line-height: 1.5;
      }
      h1 { font-size: 1.25rem; margin-bottom: 0.25rem; }
      p.sub { margin-top: 0; opacity: 0.75; font-size: 0.9rem; }
      label { display: block; margin-top: 1rem; font-size: 0.875rem; font-weight: 600; }
      input {
        width: 100%;
        padding: 0.5rem;
        margin-top: 0.25rem;
        font: inherit;
        box-sizing: border-box;
      }
      button {
        margin-top: 1.5rem;
        padding: 0.6rem 1.2rem;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button[disabled] { cursor: progress; opacity: 0.6; }
      #status { margin-top: 1.25rem; font-size: 0.9rem; }
      #status.error { color: #b3261e; }
      #status.ok { color: #146c2e; }
      .hint { font-size: 0.8rem; opacity: 0.7; margin-top: 2rem; }
    </style>
  </head>
  <body>
    <h1>ForgeWire Fabric</h1>
    <p class="sub" id="subtitle">Passkey</p>

    <!--
      Hidden by default, revealed by bridge.js only after every precondition
      passes. This page must fail CLOSED: if the script does not run at all
      (404, CSP, or the file opened outside the hub), the guards inside it
      never execute, and a visible form here would be an interactive
      credential prompt -- including a password field in register mode -- with
      nothing behind it. Do not remove `hidden`.
    -->
    <form id="form" hidden>
      <div id="username-field">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" autofocus required />
      </div>

      <div id="password-field" hidden>
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
        />
      </div>

      <button id="submit" type="submit">Continue</button>
    </form>

    <!--
      Seeded with the failure message rather than empty, for the same
      fail-closed reason: this is what the user sees if bridge.js never runs.
      The script clears it once its preconditions pass.
    -->
    <p id="status" role="status" aria-live="polite" class="error">
      This page could not start. Open it from the ForgeWire Fabric app rather
      than directly, and start again from there.
    </p>
    <noscript>
      <p class="error">
        This page needs JavaScript to run a passkey ceremony.
      </p>
    </noscript>
    <p class="hint">
      You can close this tab when it says you are done. It was opened by the
      ForgeWire Fabric app on this machine.
    </p>

    <script src="/auth/webauthn/bridge.js"></script>
  </body>
</html>
